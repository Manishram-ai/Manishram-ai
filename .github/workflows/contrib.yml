# Redraws the ASCII contribution graph in the README from GitHub's own calendar, every
# three hours, and commits it only when it changed. The commit is the Actions bot's, so it
# adds nothing to my own graph.
name: contribution graph

on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/scripts/contrib.mjs", ".github/workflows/contrib.yml"]

permissions:
  contents: write

concurrency:
  group: contrib
  cancel-in-progress: false

jobs:
  draw:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Draw the graph
        run: node .github/scripts/contrib.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit it if it changed
        run: |
          git add assets/contrib-dark.svg assets/contrib-light.svg
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "chore: redraw the contribution graph"
          git push
